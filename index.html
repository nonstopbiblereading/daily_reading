<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日讀經 · 每天兩章</title>
<link rel="stylesheet" href="css/style.css?v=2026-10">
<script src="data/months.js?v=2026-10"></script>
<script src="js/common.js?v=2026-10"></script>
</head>
<body>
<div id="nav-slot"></div>

<div class="wrap" id="main" hidden>
  <div class="page-head">
    <div class="page-kicker" id="kicker"></div>
    <h1 class="page-title" id="ttl"></h1>
    <p class="page-sub" id="sub"></p>
    <div class="stat-row">
      <div class="st"><b id="st-days">—</b><span>天</span></div>
      <div class="st"><b id="st-ch">—</b><span>章</span></div>
      <div class="st"><b id="st-done">0</b><span>已完成</span></div>
      <div class="st"><b id="st-bg">—</b><span>則背景補充</span></div>
    </div>
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <div class="tools">
      <button class="mini" onclick="jumpToday()">跳到今天</button>
      <button class="mini" onclick="resetAll()">清除本月進度紀錄</button>
    </div>
  </div>

  <div class="sec-label" id="cal-label"></div>
  <div class="cal" id="cal"></div>

  <div class="sec-label">這個月的路線</div>
  <div class="card" style="--accent:var(--primary)">
    <div class="card-title">一個月讀下來的軸線</div>
    <div id="outline" class="outline"></div>
  </div>

  <div class="card" style="--accent:var(--c-bg)">
    <div class="card-title">每天的六個區塊</div>
    <p style="font-size:13.5px">
      ① 經文重點 ② 亮點經句 ③ 讀經心得 ④ 反思問題 ⑤ 今日應用,
      再加上 ⑥ <b>背景補充</b>——把當天經文背後需要解釋的<b>歷史、地理、人物、文化風俗</b>整理出來,
      避免讀到地名、官職、禮俗時卡住或誤讀。相關條目會連到
      <a href="https://nonstopbiblereading.github.io/bible_explorer/" target="_blank" rel="noopener">聖經歷史地理人物工具</a>的地圖、時間軸與人物網。
    </p>
    <p style="margin-top:8px"><a class="xlink" id="bg-link" href="background.html">瀏覽整月背景索引 ›</a></p>
  </div>
</div>

<div id="footer-slot"></div>

<script>
boot("home").then(() => {
  const M = monthNum();
  document.title = `每日讀經 · ${PLAN.label}`;
  document.getElementById("kicker").textContent = `${MONTH_KEY.replace("-", " / ")} · 每天兩章`;
  document.getElementById("ttl").textContent = PLAN.title;
  document.getElementById("sub").textContent = PLAN.sub;
  document.getElementById("cal-label").textContent = `${M} 月讀經表`;
  document.getElementById("st-days").textContent = PLAN.days.length;
  document.getElementById("st-ch").textContent = PLAN.days.length * 2;
  document.getElementById("st-bg").textContent =
    PLAN.days.reduce((n, d) => n + (d.bg ? d.bg.length : 0), 0);
  document.getElementById("outline").innerHTML = (PLAN.outline || [])
    .map(o => `<p><b>${o.h}</b>:${o.p}</p>`).join("");
  document.getElementById("bg-link").href = withMonth("background.html");
  renderCal();
  renderFooter();
  document.getElementById("main").hidden = false;
});

function renderCal() {
  const done = getDone(), M = monthNum();
  let html = "";
  WD.forEach((w, i) => html += `<div class="cal-head${i === 0 ? " sun" : ""}">${w}</div>`);
  const lead = weekday(1);                       // 1 號是星期幾 → 前面補空格
  for (let i = 0; i < lead; i++) html += `<div class="day-cell empty"></div>`;
  for (const day of PLAN.days) {
    const wd = weekday(day.d), ok = !!done[day.d];
    html += `<a class="day-cell${ok ? " done" : ""}${wd === 0 ? " sun" : ""}" href="${withMonth("day.html?d=" + day.d)}">
      <div class="dc-num">${M}/${day.d}<span class="chk">${ok ? "✓ 已讀" : ""}</span></div>
      <div class="dc-ref">${day.ref.replace("；", "<br>")}</div>
      <div class="dc-theme">${day.theme}</div>
    </a>`;
  }
  document.getElementById("cal").innerHTML = html;
  const n = doneCount();
  document.getElementById("st-done").textContent = n;
  document.getElementById("bar").style.width = (n / PLAN.days.length * 100).toFixed(1) + "%";
}
function jumpToday() {
  const t = new Date();
  const inMonth = t.getFullYear() === monthYear() && t.getMonth() + 1 === monthNum();
  const d = inMonth ? Math.min(t.getDate(), PLAN.days.length) : 1;
  location.href = withMonth("day.html?d=" + d);
}
function resetAll() {
  if (confirm(`確定要清除 ${PLAN.label} 所有「已讀」紀錄嗎?此動作無法復原。`)) {
    try { localStorage.removeItem(doneKey()); } catch (e) {}
    renderCal();
  }
}
</script>
</body>
</html>
