<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背景索引 · 每日讀經</title>
<link rel="stylesheet" href="css/style.css">
<script src="data/months.js"></script>
<script src="js/common.js"></script>
</head>
<body>
<div id="nav-slot"></div>

<div class="wrap">
  <div class="page-head">
    <div class="page-kicker" id="kicker">背景索引</div>
    <h1 class="page-title">這個月經文背後,需要先知道的事</h1>
    <p class="page-sub" id="sub"></p>
    <div class="tools" id="filters"></div>
  </div>
  <div id="list"></div>
</div>

<div id="footer-slot"></div>

<script>
const ALL = [];
let cur = "all";
const KINDS = [["all", "全部"], ["history", "歷史"], ["place", "地理"], ["person", "人物"], ["custom", "文化風俗"]];

boot("bg").then(() => {
  PLAN.days.forEach(d => (d.bg || []).forEach(b => ALL.push({ ...b, day: d.d, short: d.short })));
  document.title = `背景索引 · ${PLAN.label}`;
  document.getElementById("kicker").textContent = `背景索引 · ${PLAN.label}`;
  document.getElementById("sub").innerHTML =
    `把 ${PLAN.days.length} 天 ${PLAN.days.length * 2} 章裡「不解釋就容易讀過去或讀錯」的<b>歷史事件、地理位置、人物身分與文化風俗</b>集中在一頁。
     可依類別篩選;點日期回到當天的完整內容。標示 ↗ 的條目可連到
     <a href="${SITES.hub}" target="_blank" rel="noopener">聖經歷史地理人物工具</a>作延伸。`;
  document.getElementById("filters").innerHTML = KINDS.map(([k, label]) => {
    const c = k === "all" ? ALL.length : ALL.filter(x => x.k === k).length;
    return `<button class="mini" data-k="${k}" onclick="setK('${k}')">${label} ${c}</button>`;
  }).join("");
  setK("all");
  renderFooter();
});

function setK(k) {
  cur = k;
  document.querySelectorAll("#filters .mini").forEach(b =>
    b.style.color = b.dataset.k === k ? "var(--primary)" : "");
  render();
}
function render() {
  const rows = ALL.filter(b => cur === "all" || b.k === cur);
  let html = "", lastDay = 0;
  for (const b of rows) {
    if (b.day !== lastDay) {
      if (lastDay) html += "</div>";
      html += `<div class="sec-label" style="margin-top:26px">${md(b.day)} · ${b.short}
        &nbsp;<a href="${withMonth("day.html?d=" + b.day)}" style="text-transform:none;letter-spacing:0">看當天內容 ›</a></div>
        <div class="card" style="--accent:var(--c-bg)">`;
      lastDay = b.day;
    }
    html += `<div class="bg-item">
      <div class="bg-head"><b>${b.n}</b><span class="tag ${b.k}">${TAG_LABEL[b.k]}</span></div>
      <p>${b.p}</p><div>${refsHtml(b.refs)}</div>
      ${b.link ? `<a class="xlink" href="${routeUrl(b.link.href)}" target="_blank" rel="noopener">${b.link.label} ↗</a>` : ""}
    </div>`;
  }
  if (lastDay) html += "</div>";
  document.getElementById("list").innerHTML = html || `<p class="page-sub">沒有符合的條目。</p>`;
}
</script>
</body>
</html>
